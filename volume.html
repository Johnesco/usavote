<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Texas Votes as Volume</title>
<!-- A page on its own, not linked from the rest of the site: Texas counties, flat, then raised by votes, then by votes per square mile,
     so that each column's volume is its votes (volume.js). -->
<meta name="robots" content="noindex" />
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "d3-geo": "https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/+esm",
  "topojson-client": "https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm"
} }
</script>
<style>
  :root { --bg: #0e1116; --panel: #151a22; --line: #2a3240; --text: #e8ecf2; --muted: #9aa5b5; --accent: #f2c14e; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100svh; overflow: hidden; }
  header { padding: 12px 16px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; }
  select option { background: var(--panel); }
  #note { margin: 8px 0 0; color: var(--muted); font-size: 13px; max-width: 900px; }
  #note b { color: var(--text); }
  main { position: relative; flex: 1; min-height: 0; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; touch-action: none; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  .controls { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 2px; padding: 5px;
    background: rgba(21,26,34,.92); border: 1px solid var(--line); border-radius: 999px; backdrop-filter: blur(6px); }
  .controls button { font: inherit; font-weight: 600; color: var(--text); background: transparent; border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; white-space: nowrap; }
  .controls button[aria-pressed="true"] { background: var(--accent); color: #111; }
  .controls button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .legend { position: absolute; top: 12px; left: 14px; display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--muted); pointer-events: none; }
  .legend div { display: flex; gap: 2px; align-items: center; }
  .legend i { display: inline-block; width: 22px; height: 9px; }
  .legend span { margin-left: 6px; }
  #tip { position: absolute; display: none; pointer-events: none; background: rgba(14,17,22,.95); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font-size: 13px; min-width: 230px; z-index: 3; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  #tip .n { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  #tip .r { display: flex; justify-content: space-between; gap: 14px; }
  #tip .m { color: var(--muted); }
  @media (max-width: 600px) {
    .controls { width: calc(100% - 24px); justify-content: center; bottom: 12px; }
    .controls button { padding: 8px 10px; font-size: 13px; }
    #note { font-size: 12.5px; }
  }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Texas: votes as volume</h1>
    <select id="race" aria-label="Race"></select>
  </div>
  <p id="note">Loading…</p>
</header>
<main>
  <div id="stage"></div>
  <div class="legend" id="legend" aria-hidden="true"></div>
  <div id="tip"></div>
  <div id="loading">Loading the map…</div>
  <div class="controls" role="group" aria-label="How the counties stand">
    <button type="button" id="flat" aria-pressed="true">Flat</button>
    <button type="button" id="votes" aria-pressed="false">Height = votes</button>
    <button type="button" id="volume" aria-pressed="false">Volume = votes</button>
  </div>
</main>
<script type="module" src="volume.js"></script>
</body>
</html>
