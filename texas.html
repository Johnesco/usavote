<body>
<div class="app">
  <aside>
    <div id="views"></div>
    <div class="kicker" id="kicker"></div>
    <h1 id="title">Texas election results</h1>
    <p class="sub" id="raceLine">Loading…</p>

    <p id="headline"></p>

    <h2>Land vs. votes</h2>
    <div class="bars" id="bars"></div>

    <div class="flights" id="flights"></div>

    <h2 id="yearTitle"></h2>
    <div class="table-wrap"><table class="races-table" id="yearTable"></table></div>
    <div id="officeBlock">
      <h2 id="officeTitle"></h2>
      <div class="table-wrap"><table class="races-table" id="officeTable"></table></div>
    </div>

    <h2>What you're seeing</h2>
    <p id="scale"></p>
    <p id="raiseText"></p>
    <p id="harris"></p>

    <h2 id="legHead">Winner's share of the county vote</h2>
    <div class="legend-title" id="legRTitle"></div>
    <div class="legend" id="legR"></div>
    <div class="legend-title" id="legDTitle"></div>
    <div class="legend" id="legD"></div>

    <h2>Method</h2>
    <div class="sources" id="method"></div>

    <h2>Sources</h2>
    <div class="sources" id="sources"></div>
    <p class="sources">This page counts visits with <a href="https://www.goatcounter.com" target="_blank" rel="noopener">GoatCounter</a>, which uses no cookies and does not collect personal data.</p>
  </aside>
  <main>
    <div class="races" id="races">
      <div class="bar-groups">
      <div class="group" id="picker" role="group" aria-label="Choose a year and race">
        <select id="yearSelect" aria-label="Year"></select>
        <select id="raceSelect" aria-label="Race"></select>
      </div>
      <div class="group" id="goRow" role="group" aria-label="Go to a place">
        <span class="pick-label">Go to</span>
        <select id="goCity" aria-label="Go to a city"><option value="">City…</option></select>
        <select id="goCounty" aria-label="Go to a county"><option value="">County…</option></select>
        <select id="goPrecinct" aria-label="Go to a precinct in the county" title="Pick a county first" disabled><option value="">Precinct…</option></select>
      </div>
      </div>
      <div class="info-row">
        <div class="place-info" id="placeInfo" aria-live="polite"></div>
        <div class="hint" id="hint">Drag to pan · scroll to zoom · hover over a county</div>
      </div>
    </div>
    <div class="map-area">
      <div id="stage"></div>
      <div id="loading">Loading map…</div>
      <div id="labels"></div>
      <div id="tip"></div>
      <div class="controls">
        <div class="seg" role="group" aria-label="Flat map or 3D columns">
          <button type="button" id="viewFlat" aria-pressed="true" title="The flat map, seen from above">Flat</button>
          <button type="button" id="view3d" aria-pressed="false" title="Columns raised by votes cast">3D</button>
        </div>
        <div class="seg" id="turnWrap" hidden>
          <button type="button" id="turn" aria-pressed="false" title="Turn the map's slow rotation on or off">Rotation off</button>
        </div>
        <button class="ghost" id="reset" title="Reset camera">Reset</button>
      </div>
    </div>
  </main>
</div>

<script type="module" src="app.js?v=dadc89e19e"></script>
<script id="gc" data-goatcounter="https://texaslooksred.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
